<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Izary Store</title></head><body style="font-family:system-ui;margin:0;background:#f6f6f6">
<header style="background:#059669;color:#fff;padding:16px"><h1 style="margin:0">Izary Store</h1><p id="modeText">Mode Pembeli - Lihat Katalog</p><div><button onclick="showPembeli()" style="background:#fff;color:#059669;border:0;padding:10px;border-radius:10px">🛍️ Pembeli</button><button onclick="askAdmin()" style="background:#f59e0b;color:#fff;border:0;padding:10px;border-radius:10px">🔐 Masuk Admin</button></div></header>
<main style="padding:14px">
<section id="pembeli"><input id="search" placeholder="Cari produk..." oninput="render()" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ddd"><div id="grid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"></div><div style="background:#fff;padding:14px;border-radius:12px;margin-top:14px"><h3>Keranjang (<span id="cartCount">0</span>)</h3><div id="cartList"></div><b>Total: <span id="total">Rp 0</span></b><br><input id="buyerName" placeholder="Nama kamu" style="width:100%;padding:10px;margin:5px 0"><input id="buyerWA" placeholder="No WA" style="width:100%;padding:10px;margin:5px 0"><button onclick="checkout()" style="background:#ea580c;color:#fff;border:0;padding:12px;border-radius:10px;width:100%;margin-top:8px">Checkout via WA</button></div></section>
<section id="admin" style="display:none"><h2>Admin - Tambah Produk</h2><input id="pName" placeholder="Nama produk" style="width:100%;padding:10px;margin:5px 0"><input id="pPrice" type="number" placeholder="Harga" style="width:100%;padding:10px;margin:5px 0"><input id="pDisc" type="number" placeholder="Harga Diskon (opsional)" style="width:100%;padding:10px;margin:5px 0"><input id="pStock" type="number" placeholder="Stok" style="width:100%;padding:10px;margin:5px 0"><textarea id="pDesc" placeholder="Deskripsi produk" style="width:100%;padding:10px;margin:5px 0"></textarea><select id="pPhoto" style="width:100%;padding:10px"><option value="☕">☕ Kopi</option><option value="🍟">🍟 Keripik</option><option value="🍯">🍯 Madu</option><option value="👕">👕 Kaos</option><option value="👜">👜 Tas</option><option value="🧼">🧼 Sabun</option><option value="👟">👟 Sepatu</option><option value="🍰">🍰 Kue</option></select><button onclick="addProduct()" style="background:#059669;color:#fff;border:0;padding:12px;border-radius:10px;width:100%">Simpan Produk</button><button onclick="showPembeli()" style="background:#ddd;border:0;padding:12px;border-radius:10px;width:100%;margin-top:8px">Kembali ke Pembeli</button><h3>Daftar Produk (Admin)</h3><div id="adminList"></div></section>
</main>
<script>
let products=[{name:'Kopi Susu',price:18000,discount:15000,stock:20,desc:'Kopi susu gula aren enak',photo:'☕'},{name:'Keripik Singkong',price:12000,discount:0,stock:35,desc:'Keripik singkong pedas gurih',photo:'🍟'},{name:'Madu Murni',price:65000,discount:55000,stock:10,desc:'Madu murni asli',photo:'🍯'}];
let cart=[];let isAdmin=false;
function showPembeli(){document.getElementById('pembeli').style.display='block';document.getElementById('admin').style.display='none';document.getElementById('modeText').innerText='Mode Pembeli - Lihat Katalog';render();}
function askAdmin(){let p=prompt('Masukkan Password Admin (coba: admin123)');if(p==='admin123'){isAdmin=true;document.getElementById('pembeli').style.display='none';document.getElementById('admin').style.display='block';document.getElementById('modeText').innerText='Mode Admin - Kamu bisa edit';renderAdmin();}else{alert('Password salah! Pembeli tidak bisa masuk Admin');}}
function render(){let q=(document.getElementById('search').value||'').toLowerCase();let list=products.filter(x=>x.name.toLowerCase().includes(q));document.getElementById('grid').innerHTML=list.map((p,i)=>`<div style="background:#fff;border-radius:12px;padding:10px"><div style="font-size:48px;text-align:center;background:#fef3c7;border-radius:10px;padding:14px">${p.photo}</div>${p.discount?`<span style="background:#ea580c;color:#fff;padding:2px 6px;border-radius:6px;font-size:12px">-${Math.round((1-p.discount/p.price)*100)}%</span>`:''}<br><b>${p.name}</b><br><span style="color:#ea580c;font-weight:800;font-size:18px">Rp ${(p.discount||p.price).toLocaleString('id-ID')}</span><br>${p.discount?`<s style="color:#999">Rp ${p.price.toLocaleString('id-ID')}</s><br>`:''}<small>${p.desc}</small><br><small>Stok: ${p.stock}</small><br><button onclick="addToCart(${i})" style="background:#059669;color:#fff;border:0;padding:10px;border-radius:10px;width:100%;margin-top:6px">+ Keranjang</button></div>`).join('');}
function renderAdmin(){document.getElementById('adminList').innerHTML=products.map((p,i)=>`<div style="background:#fff;padding:10px;border-radius:10px;margin:6px 0">${p.photo} <b>${p.name}</b> - Rp ${p.price} - Stok ${p.stock} <button onclick="del(${i})" style="background:#ef4444;color:#fff;border:0;padding:8px;border-radius:8px">Hapus</button></div>`).join('');}
function addToCart(i){let f=cart.find(c=>c.idx===i);if(f)f.qty++;else cart.push({idx:i,qty:1});updateCart();}
function updateCart(){document.getElementById('cartCount').innerText=cart.reduce((a,b)=>a+b.qty,0);document.getElementById('cartList').innerHTML=cart.map(c=>{let p=products[c.idx];return `<div>${p.photo} ${p.name} x ${c.qty} = Rp ${((p.discount||p.price)*c.qty).toLocaleString('id-ID')}</div>`}).join('');document.getElementById('total').innerText='Rp '+cart.reduce((a,b)=>a+b.qty*(products[b.idx].discount||products[b.idx].price),0).toLocaleString('id-ID');}
function checkout(){if(!cart.length)return alert('Keranjang kosong');let txt='Halo Izary Store, saya mau pesan:%0A'+cart.map(c=>{let p=products[c.idx];return `- ${p.name} x ${c.qty} = Rp ${((p.discount||p.price)*c.qty).toLocaleString('id-ID')}`}).join('%0A')+'%0ANama: '+document.getElementById('buyerName').value+'%0AWA: '+document.getElementById('buyerWA').value;window.open('https://wa.me/6281234567890?text='+txt,'_blank');}
function addProduct(){products.push({name:document.getElementById('pName').value,price:+document.getElementById('pPrice').value,discount:+document.getElementById('pDisc').value||0,stock:+document.getElementById('pStock').value,desc:document.getElementById('pDesc').value,photo:document.getElementById('pPhoto').value});alert('Produk tersimpan!');renderAdmin();showPembeli();}
function del(i){if(confirm('Hapus produk ini?')){products.splice(i,1);renderAdmin();render();}}
render();
</script></body></html>
