<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Izary Store</title></head><body style="font-family:system-ui;background:#f6f6f6;margin:0"><header style="background:#059669;color:#fff;padding:16px"><h1>Izary Store</h1><p>Mode Pembeli & Admin</p></header><main style="padding:14px"><h2>Katalog</h2><div id="grid"></div><h3>Tambah Produk (Admin)</h3><input id="pName" placeholder="Nama produk" style="width:100%;padding:10px;margin:5px 0"><input id="pPrice" type="number" placeholder="Harga" style="width:100%;padding:10px;margin:5px 0"><input id="pStock" type="number" placeholder="Stok" style="width:100%;padding:10px;margin:5px 0"><button onclick="add()" style="background:#059669;color:#fff;border:0;padding:12px;border-radius:10px;width:100%">Simpan Produk</button></main><script>let products=[];function render(){document.getElementById('grid').innerHTML=products.map(p=>`<div style="background:#fff;padding:12px;border-radius:12px;margin:8px 0"><b>${p.name}</b><br>Rp ${p.price} | Stok: ${p.stock}</div>`).join('')||'Belum ada produk';}function add(){products.push({name:pName.value,price:pPrice.value,stock:pStock.value});render();alert('Produk tersimpan');}render();</script></body></html>
