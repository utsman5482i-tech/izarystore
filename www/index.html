<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Izary Store</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
body{margin:0;font-family:Arial;background:#f6f6f6}
header{background-image:url('header-bg.jpg');background-size:cover;background-position:center;padding:18px 14px;color:#14532d;text-align:center}
header img{width:90px;height:90px;object-fit:contain;background:#fff;border-radius:50%;padding:5px}
header h1{margin:8px 0 2px;font-size:26px}
header p{margin:0;font-weight:bold}
.topbar{display:flex;gap:8px;padding:10px}
.topbar button{flex:1;padding:12px;border:0;border-radius:10px;font-weight:bold;cursor:pointer}
#btnKeranjang{background:#14532d;color:#fff}
#btnAdmin{background:#fff;border:1px solid #ddd}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 5px #0001;cursor:pointer}
.card img{width:100%;height:180px;object-fit:contain;background:#fff}
.card b{display:block;padding:8px 8px 0}
.card span{color:#14532d;font-weight:bold;display:block;padding:4px 8px 10px}
#detail,#cartBox,#adminBox{display:none;position:fixed;inset:0;background:#fff;z-index:99;overflow:auto;padding:16px;box-sizing:border-box}
#detail img{width:100%;border-radius:12px;height:auto;max-height:500px;object-fit:contain;background:#fff}
input,textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}
.btn{width:100%;padding:13px;border:0;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:8px}
.btnGreen{background:#25D366}
.btnDark{background:#14532d;color:#fff}
.btnGrey{background:#eee}
.row{display:flex;gap:8px;align-items:center;justify-content:center}
.row button{width:36px;height:36px;font-size:20px;border-radius:50%;border:1px solid #ddd;background:#fff}
.order{border:1px solid #eee;border-radius:10px;padding:10px;margin:8px 0}
</style></head><body>
<header><img src="logo-izary-store.png"><h1>IZARY STORE</h1><p>Toko Herbal Terpercaya</p></header>
<div class="topbar"><button id="btnKeranjang" onclick="openCart()">+ Keranjang (<span id="cartCount">0</span>)</button><button id="btnAdmin" onclick="openAdmin()">Admin</button></div>
<div style="padding:0 10px"><input id="search" placeholder="Cari produk herbal..." oninput="render()"></div>
<div id="grid"></div>
<div id="status" style="display:none"></div>
<div id="detail"><button class="btn btnGrey" onclick="closeAll()">← Kembali</button><img id="dImg"><h2 id="dName"></h2><div id="dPrice" style="color:#14532d;font-weight:bold;font-size:20px"></div><p id="dDesc" style="white-space:pre-wrap"></p><div class="row"><button onclick="chgQty(-1)">-</button><b id="dQty" style="font-size:20px">1</b><button onclick="chgQty(1)">+</button></div><button class="btn btnDark" onclick="addToCartFromDetail()">+ Keranjang</button></div>
<div id="cartBox"><button class="btn btnGrey" onclick="closeAll()">← Kembali</button><h2>Keranjang</h2><div id="cartList"></div><h3 id="cartTotal"></h3><input id="buyerName" placeholder="Nama pembeli"><input id="buyerAddr" placeholder="Alamat lengkap"><button class="btn btnGreen" onclick="checkoutWA()">Checkout via WhatsApp</button></div>
<div id="adminBox"><button class="btn btnGrey" onclick="closeAll()">← Kembali</button><h2>Admin Izary Store</h2><div id="loginBox"><input id="pass" type="password" placeholder="Password admin"><button class="btn btnDark" onclick="login()">Masuk Admin</button></div><div id="adminMain" style="display:none"><h3>Tambah / Edit Produk</h3><input id="pName" placeholder="Nama produk"><input id="pPrice" type="number" placeholder="Harga (contoh 50000)"><textarea id="pDesc" placeholder="Deskripsi lengkap produk"></textarea><input type="file" id="pPhoto" accept="image/*"><button class="btn btnDark" onclick="saveProduct()">Simpan Produk ke Firebase</button><button class="btn btnGrey" onclick="cancelEdit()">Batal Edit</button><h3>Daftar Produk (Firebase)</h3><div id="adminList"></div><h3>Pesanan Masuk</h3><div id="orderList"></div></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyAFuzhZrAFYzwdmUoLDtohU3zCtJrj7poE",authDomain:"izary-store.firebaseapp.com",projectId:"izary-store",storageBucket:"izary-store.firebasestorage.app",messagingSenderId:"350622657122",appId:"1:350622657122:web:ada03bf6eb55a6fef4bf3b"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
let products=[],cart=JSON.parse(localStorage.getItem('izary_cart')||'[]'),editId=null,curId=null,curQty=1;
const ADMIN_PASS="iza303";const WA_NUMBER="6285217303873";
const CURRENT_VERSION="V8";
async function checkUpdate(){try{const r=await fetch('https://raw.githubusercontent.com/utsman5482i-tech/izarystore/main/www/version.json');const v=await r.json();if(v.latestVersion && v.latestVersion!==CURRENT_VERSION){if(confirm('Ada update baru '+v.latestVersion+'! '+(v.message||'')+'\n\nKlik OK untuk download update.')){window.open(v.apkUrl||'https://drive.google.com','_blank');}}}catch(e){}}
async function loadProducts(){try{const snap=await db.collection('products').orderBy('createdAt','desc').get();products=snap.docs.map(d=>({id:d.id,...d.data()}));if(products.length===0){const awal=[{name:'Bio Legend',price:75000,desc:'Herbal untuk stamina dan vitalitas. Minum 1x sehari setelah makan.',photo:'',createdAt:Date.now()},{name:'Bio Blood Elixir',price:85000,desc:'Herbal untuk membantu melancarkan peredaran darah dan menjaga stamina tubuh.',photo:'',createdAt:Date.now()+1}];for(let p of awal){await db.collection('products').add(p);}return loadProducts();}document.getElementById('status').innerText=products.length+' produk dari Firebase - tidak akan hilang lagi';render();}catch(e){document.getElementById('status').innerText='Gagal ke Firebase: '+e.message;}}
function render(){const q=(document.getElementById('search').value||'').toLowerCase();const list=products.filter(p=>p.name.toLowerCase().includes(q));document.getElementById('grid').innerHTML=list.map(p=>`<div class="card" onclick="openDetail('${p.id}')">${p.photo?`<img src="${p.photo}">`:`<div style="height:140px;background:#e8f5e9;display:flex;align-items:center;justify-content:center;font-size:40px">🌿</div>`}<b>${p.name}</b><span>Rp ${Number(p.price||0).toLocaleString('id-ID')}</span></div>`).join('')||'<p style="text-align:center">Belum ada produk. Masuk Admin untuk tambah.</p>';document.getElementById('cartCount').innerText=cart.reduce((a,b)=>a+b.qty,0);}
function openDetail(id){curId=id;curQty=1;const p=products.find(x=>x.id===id);document.getElementById('dImg').src=p.photo||'';document.getElementById('dImg').style.display=p.photo?'block':'none';document.getElementById('dName').innerText=p.name;document.getElementById('dPrice').innerText='Rp '+Number(p.price).toLocaleString('id-ID');document.getElementById('dDesc').innerText=p.desc||'';document.getElementById('dQty').innerText=curQty;document.getElementById('detail').style.display='block';}
function chgQty(d){curQty=Math.max(1,curQty+d);document.getElementById('dQty').innerText=curQty;}
function addToCartFromDetail(){const p=products.find(x=>x.id===curId);const f=cart.find(x=>x.id===curId);if(f)f.qty+=curQty;else cart.push({id:curId,name:p.name,price:p.price,qty:curQty});localStorage.setItem('izary_cart',JSON.stringify(cart));closeAll();render();alert('Masuk keranjang');}
function closeAll(){document.getElementById('detail').style.display='none';document.getElementById('cartBox').style.display='none';document.getElementById('adminBox').style.display='none';}
function openCart(){renderCart();document.getElementById('cartBox').style.display='block';}
function renderCart(){let total=0;document.getElementById('cartList').innerHTML=cart.map((c,i)=>{total+=c.price*c.qty;return `<div class="order"><b>${c.name}</b><br>Rp ${Number(c.price).toLocaleString('id-ID')} x ${c.qty} = Rp ${(c.price*c.qty).toLocaleString('id-ID')}<br><div class="row" style="margin-top:8px"><button onclick="cartQty(${i},-1)">-</button><b>${c.qty}</b><button onclick="cartQty(${i},1)">+</button><button onclick="cartDel(${i})" style="width:auto;padding:0 10px;border-radius:8px">Hapus</button></div></div>`}).join('')||'Keranjang masih kosong';document.getElementById('cartTotal').innerText='Total: Rp '+total.toLocaleString('id-ID');}
function cartQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);localStorage.setItem('izary_cart',JSON.stringify(cart));renderCart();render();}
function cartDel(i){cart.splice(i,1);localStorage.setItem('izary_cart',JSON.stringify(cart));renderCart();render();}
async function checkoutWA(){if(cart.length===0)return alert('Keranjang kosong');const nama=document.getElementById('buyerName').value||'-';const alamat=document.getElementById('buyerAddr').value||'-';let total=0;let teks='Halo Izary Store, saya mau order:%0A%0A';cart.forEach(c=>{total+=c.price*c.qty;teks+=`- ${c.name} x ${c.qty} = Rp ${(c.price*c.qty).toLocaleString('id-ID')}%0A`;});teks+=`%0ATotal: Rp ${total.toLocaleString('id-ID')}%0ANama: ${nama}%0AAlamat: ${alamat}`;try{await db.collection('orders').add({items:cart,total,nama,alamat,createdAt:Date.now()});}catch(e){}window.open('https://wa.me/'+WA_NUMBER+'?text='+teks,'_blank');cart=[];localStorage.removeItem('izary_cart');render();closeAll();}
function openAdmin(){document.getElementById('adminBox').style.display='block';loadOrders();}
function login(){if(document.getElementById('pass').value===ADMIN_PASS){document.getElementById('loginBox').style.display='none';document.getElementById('adminMain').style.display='block';renderAdmin();}else alert('Password salah');}
function cancelEdit(){editId=null;document.getElementById('pName').value='';document.getElementById('pPrice').value='';document.getElementById('pDesc').value='';}
async function saveProduct(){const name=document.getElementById('pName').value.trim();const price=Number(document.getElementById('pPrice').value||0);const desc=document.getElementById('pDesc').value;if(!name||!price)return alert('Isi nama & harga dulu');let photo='';const f=document.getElementById('pPhoto').files[0];if(f){photo=await new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(f);});}else if(editId){const old=products.find(p=>p.id===editId);photo=old.photo||'';}const data={name,price,desc,photo,createdAt:Date.now()};if(editId){await db.collection('products').doc(editId).update({name,price,desc,photo});}else{await db.collection('products').add(data);}cancelEdit();document.getElementById('pPhoto').value='';await loadProducts();renderAdmin();alert('Tersimpan di Firebase!');}
function renderAdmin(){document.getElementById('adminList').innerHTML=products.map(p=>`<div class="order"><b>${p.name}</b> - Rp ${Number(p.price).toLocaleString('id-ID')}<br><button class="btn btnGrey" onclick="editProduct('${p.id}')">Edit</button><button class="btn btnGrey" onclick="delProduct('${p.id}')">Hapus</button></div>`).join('');}
function editProduct(id){const p=products.find(x=>x.id===id);editId=id;document.getElementById('pName').value=p.name;document.getElementById('pPrice').value=p.price;document.getElementById('pDesc').value=p.desc||'';}
async function delProduct(id){if(!confirm('Hapus produk ini dari Firebase?'))return;await db.collection('products').doc(id).delete();await loadProducts();renderAdmin();}
async function loadOrders(){try{const snap=await db.collection('orders').orderBy('createdAt','desc').limit(20).get();const list=snap.docs.map(d=>d.data());document.getElementById('orderList').innerHTML=list.map(o=>`<div class="order"><b>${o.nama}</b> - Rp ${Number(o.total).toLocaleString('id-ID')}<br>${o.items.map(i=>i.name+' x '+i.qty).join(', ')}<br>${o.alamat}</div>`).join('')||'Belum ada pesanan';}catch(e){document.getElementById('orderList').innerText='Belum ada pesanan';}}
loadProducts();render();checkUpdate();
</script></body></html>
