<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Izary Store</title></head><body style="font-family:system-ui;margin:0;background:#f6f6f6">
<header style="background:#059669;color:#fff;padding:16px;text-align:center"><img src="logo.png" style="width:80px;height:80px;object-fit:cover;border-radius:50%;background:#fff;display:block;margin:0 auto 8px"><h1 style="margin:0">Izary Store</h1><p id="modeText">Mode Pembeli</p><div><button onclick="showPembeli()" style="background:#fff;color:#059669;border:0;padding:10px;border-radius:10px">Pembeli</button><button onclick="askAdmin()" style="background:#f59e0b;color:#fff;border:0;padding:10px;border-radius:10px">Masuk Admin</button></div></header>
<main style="padding:14px">
<section id="pembeli"><input id="search" placeholder="Cari produk..." oninput="render()" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ddd"><div id="grid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"></div><div style="background:#fff;padding:14px;border-radius:12px;margin-top:14px"><h3>Keranjang (<span id="cartCount">0</span>)</h3><div id="cartList"></div><b>Total: <span id="total">Rp 0</span></b><br><button onclick="checkout()" style="background:#ea580c;color:#fff;border:0;padding:12px;border-radius:10px;width:100%">Checkout via WA</button></div></section>
<section id="admin" style="display:none"><h2>Admin - Tambah Produk</h2><input id="pName" placeholder="Nama produk" style="width:100%;padding:10px;margin:5px 0"><input id="pPrice" type="number" placeholder="Harga" style="width:100%;padding:10px;margin:5px 0"><input id="pDisc" type="number" placeholder="Harga Diskon (opsional)" style="width:100%;padding:10px;margin:5px 0"><input id="pStock" type="number" placeholder="Stok" style="width:100%;padding:10px;margin:5px 0"><textarea id="pDesc" placeholder="Deskripsi" style="width:100%;padding:10px"></textarea><br><b>Foto Produk Asli dari Galeri</b><br><input type="file" id="pFile" accept="image/*" onchange="previewFoto(event)"><br><img id="previewImg" style="width:100%;max-height:200px;object-fit:cover;border-radius:10px;display:none"><br><button onclick="addProduct()" style="background:#059669;color:#fff;border:0;padding:12px;border-radius:10px;width:100%;margin-top:8px">Simpan Produk</button><button onclick="showPembeli()" style="background:#ddd;border:0;padding:12px;border-radius:10px;width:100%;margin-top:8px">Kembali ke Pembeli</button><h3>Daftar Produk</h3><div id="adminList"></div></section>
</main>
<script>
let products=[{name:'Kopi Susu',price:18000,discount:15000,stock:20,desc:'Kopi susu gula aren',photo:'',emoji:'☕'}];
let cart=[];let tempPhoto='';
function previewFoto(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=function(ev){tempPhoto=ev.target.result;let im=document.getElementById('previewImg');im.src=tempPhoto;im.style.display='block';};r.readAsDataURL(f);}
function showPembeli(){document.getElementById('pembeli').style.display='block';document.getElementById('admin').style.display='none';render();}
function askAdmin(){let p=prompt('Password Admin (iza303)');if(p==='iza303'){document.getElementById('pembeli').style.display='none';document.getElementById('admin').style.display='block';renderAdmin();}else alert('Password salah');}
function photoHTML(p){if(p.photo)return `<img src="${p.photo}" style="width:100%;height:120px;object-fit:cover;border-radius:10px">`;return `<div style="font-size:48px;text-align:center;background:#fef3c7;border-radius:10px;padding:14px">${p.emoji}</div>`;}
function render(){let q=(document.getElementById('search').value||'').toLowerCase();let list=products.filter(x=>x.name.toLowerCase().includes(q));document.getElementById('grid').innerHTML=list.map((p,i)=>`<div style="background:#fff;border-radius:12px;padding:10px">${photoHTML(p)}<br><b>${p.name}</b><br><span style="color:#ea580c;font-weight:800">Rp ${(p.discount||p.price).toLocaleString('id-ID')}</span><br><small>${p.desc}</small><br><button onclick="addToCart(${products.indexOf(p)})" style="background:#059669;color:#fff;border:0;padding:10px;border-radius:10px;width:100%">+ Keranjang</button></div>`).join('');}
function renderAdmin(){document.getElementById('adminList').innerHTML=products.map((p,i)=>`<div style="background:#fff;padding:10px;border-radius:10px;margin:6px 0">${p.photo?`<img src="${p.photo}" style="width:50px;height:50px;object-fit:cover;border-radius:8px">`:p.emoji} <b>${p.name}</b> <button onclick="del(${i})" style="background:#ef4444;color:#fff;border:0;padding:8px;border-radius:8px">Hapus</button></div>`).join('');}
function addToCart(i){let f=cart.find(c=>c.idx===i);if(f)f.qty++;else cart.push({idx:i,qty:1});updateCart();}
function updateCart(){document.getElementById('cartCount').innerText=cart.reduce((a,b)=>a+b.qty,0);document.getElementById('cartList').innerHTML=cart.map(c=>{let p=products[c.idx];return `<div>${p.name} x ${c.qty}</div>`}).join('');document.getElementById('total').innerText='Rp '+cart.reduce((a,b)=>a+b.qty*(products[b.idx].discount||products[b.idx].price),0).toLocaleString('id-ID');}
function checkout(){if(!cart.length)return alert('Keranjang kosong');alert('Pesanan dibuat!');}
function addProduct(){products.push({name:document.getElementById('pName').value,price:+document.getElementById('pPrice').value,discount:+document.getElementById('pDisc').value||0,stock:+document.getElementById('pStock').value,desc:document.getElementById('pDesc').value,photo:tempPhoto,emoji:'📦'});tempPhoto='';alert('Produk tersimpan!');renderAdmin();showPembeli();}
function del(i){products.splice(i,1);renderAdmin();render();}
render();
</script></body></html>
