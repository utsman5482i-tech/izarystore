<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Izary Store</title></head><body style="font-family:system-ui;margin:0;background:#f6f6f6">
<header style="background:#059669;color:#fff;padding:16px;text-align:center"><img src="logo.png" style="width:80px;height:80px;object-fit:cover;border-radius:50%;background:#fff;display:block;margin:0 auto 8px"><h1 style="margin:0">Izary Store</h1><p id="modeText">Mode Pembeli</p><div><button onclick="showPembeli()" style="background:#fff;color:#059669;border:0;padding:10px;border-radius:10px">Pembeli</button><button onclick="askAdmin()" style="background:#f59e0b;color:#fff;border:0;padding:10px;border-radius:10px">Masuk Admin</button></div></header>
<main style="padding:14px">
<section id="pembeli"><input id="search" placeholder="Cari produk..." oninput="render()" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ddd"><div id="grid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"></div><div style="background:#fff;padding:14px;border-radius:12px;margin-top:14px"><h3>Keranjang (<span id="cartCount">0</span>)</h3><div id="cartList"></div><b>Total: <span id="total">Rp 0</span></b><br><input id="buyerName" placeholder="Nama kamu" style="width:100%;padding:10px;margin:5px 0"><input id="buyerWA" placeholder="No WA kamu (08...)" style="width:100%;padding:10px;margin:5px 0"><textarea id="buyerAddr" placeholder="Alamat lengkap" style="width:100%;padding:10px"></textarea><button onclick="checkoutWA()" style="background:#25D366;color:#fff;border:0;padding:14px;border-radius:10px;width:100%;margin-top:8px;font-weight:800">Checkout via WA - Kirim ke Admin</button><p style="font-size:12px;color:#666">Pesanan akan terkirim ke WhatsApp Admin (085217303873) + tersimpan di Daftar Pesanan Admin.</p></div></section>
<section id="admin" style="display:none"><h2>Admin Izary Store</h2><div style="background:#fff;padding:12px;border-radius:10px"><b>🔔 Daftar Pesanan Masuk (<span id="orderCount">0</span>)</b><div id="orderList"><p style="color:#666">Belum ada pesanan.</p></div></div><div style="background:#fff;padding:12px;border-radius:10px;margin-top:12px"><b>Tambah Produk</b><br><input id="pName" placeholder="Nama produk" style="width:100%;padding:10px;margin:5px 0"><input id="pPrice" type="number" placeholder="Harga" style="width:100%;padding:10px;margin:5px 0"><input id="pDisc" type="number" placeholder="Harga Diskon (opsional)" style="width:100%;padding:10px;margin:5px 0"><input id="pStock" type="number" placeholder="Stok" style="width:100%;padding:10px;margin:5px 0"><textarea id="pDesc" placeholder="Deskripsi" style="width:100%;padding:10px"></textarea><br><b>Foto Produk Asli dari Galeri</b><br><input type="file" id="pFile" accept="image/*" onchange="previewFoto(event)"><br><img id="previewImg" style="width:100%;max-height:200px;object-fit:cover;border-radius:10px;display:none"><br><button onclick="addProduct()" style="background:#059669;color:#fff;border:0;padding:12px;border-radius:10px;width:100%;margin-top:8px">Simpan Produk</button></div><button onclick="showPembeli()" style="background:#ddd;border:0;padding:12px;border-radius:10px;width:100%;margin-top:10px">Kembali ke Pembeli</button><h3>Daftar Produk</h3><div id="adminList"></div></section>
</main>
<script>
const ADMIN_WA='6285217303873';
let products=JSON.parse(localStorage.getItem('izary_products')||'null')||[{name:'Probiotik Blood Elixir',price:75000,discount:0,stock:20,desc:'Probiotik Blood Elixir',photo:'',emoji:'💊'},{name:'Bio Legend',price:75000,discount:0,stock:20,desc:'Bio Legend',photo:'',emoji:'💊'}];
let cart=JSON.parse(localStorage.getItem('izary_cart')||'[]');let orders=JSON.parse(localStorage.getItem('izary_orders')||'[]');let tempPhoto='';
function saveAll(){localStorage.setItem('izary_products',JSON.stringify(products));localStorage.setItem('izary_cart',JSON.stringify(cart));localStorage.setItem('izary_orders',JSON.stringify(orders));}
function previewFoto(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=function(ev){tempPhoto=ev.target.result;let im=document.getElementById('previewImg');im.src=tempPhoto;im.style.display='block';};r.readAsDataURL(f);}
function showPembeli(){document.getElementById('pembeli').style.display='block';document.getElementById('admin').style.display='none';render();}
function askAdmin(){let p=prompt('Password Admin');if(p==='iza303'){document.getElementById('pembeli').style.display='none';document.getElementById('admin').style.display='block';renderAdmin();renderOrders();}else alert('Password salah');}
function photoHTML(p){if(p.photo)return `<img src="${p.photo}" style="width:100%;height:120px;object-fit:cover;border-radius:10px">`;return `<div style="font-size:48px;text-align:center;background:#fef3c7;border-radius:10px;padding:14px">${p.emoji}</div>`;}
function render(){let q=(document.getElementById('search').value||'').toLowerCase();let list=products.filter(x=>x.name.toLowerCase().includes(q));document.getElementById('grid').innerHTML=list.map((p,i)=>`<div style="background:#fff;border-radius:12px;padding:10px">${photoHTML(p)}<br><b>${p.name}</b><br><span style="color:#ea580c;font-weight:800">Rp ${(p.discount||p.price).toLocaleString('id-ID')}</span><br><small>${(p.desc||'').slice(0,80)}</small><br><button onclick="addToCart(${products.indexOf(p)})" style="background:#059669;color:#fff;border:0;padding:10px;border-radius:10px;width:100%">+ Keranjang</button></div>`).join('');updateCart();}
function renderAdmin(){document.getElementById('adminList').innerHTML=products.map((p,i)=>`<div style="background:#fff;padding:10px;border-radius:10px;margin:6px 0">${p.photo?`<img src="${p.photo}" style="width:50px;height:50px;object-fit:cover;border-radius:8px">`:p.emoji} <b>${p.name}</b> - Rp ${p.price} <button onclick="del(${i})" style="background:#ef4444;color:#fff;border:0;padding:8px;border-radius:8px">Hapus</button></div>`).join('');}
function renderOrders(){document.getElementById('orderCount').innerText=orders.length;if(!orders.length){document.getElementById('orderList').innerHTML='<p style="color:#666">Belum ada pesanan.</p>';return;}document.getElementById('orderList').innerHTML=orders.map((o,i)=>`<div style="border:1px solid #eee;padding:10px;border-radius:10px;margin:6px 0"><b>Pesanan #${i+1} - ${o.status}</b><br><small>${o.date}</small><br>Nama: ${o.name}<br>WA: ${o.wa}<br>Alamat: ${o.addr}<br>${o.items.map(it=>`${it.name} x ${it.qty} = Rp ${(it.price*it.qty).toLocaleString('id-ID')}`).join('<br>')}<br><b>Total: Rp ${o.total.toLocaleString('id-ID')}</b><br><button onclick="setOrder(${i},'Diproses')" style="background:#f59e0b;color:#fff;border:0;padding:8px;border-radius:8px">Proses</button> <button onclick="setOrder(${i},'Selesai')" style="background:#059669;color:#fff;border:0;padding:8px;border-radius:8px">Selesai</button></div>`).join('');}
function setOrder(i,s){orders[i].status=s;saveAll();renderOrders();}
function addToCart(i){let f=cart.find(c=>c.idx===i);if(f)f.qty++;else cart.push({idx:i,qty:1});saveAll();updateCart();}
function changeQty(ci,d){cart[ci].qty+=d;if(cart[ci].qty<=0)cart.splice(ci,1);saveAll();updateCart();}
function removeCart(ci){cart.splice(ci,1);saveAll();updateCart();}
function updateCart(){document.getElementById('cartCount').innerText=cart.reduce((a,b)=>a+b.qty,0);document.getElementById('cartList').innerHTML=cart.map((c,ci)=>{let p=products[c.idx];if(!p)return '';return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee"><span>${p.name}<br><small>Rp ${(p.discount||p.price).toLocaleString('id-ID')} x ${c.qty} = <b>Rp ${((p.discount||p.price)*c.qty).toLocaleString('id-ID')}</b></small></span><span><button onclick="changeQty(${ci},-1)" style="padding:6px 10px;border-radius:8px">-</button> <b>${c.qty}</b> <button onclick="changeQty(${ci},1)" style="padding:6px 10px;border-radius:8px">+</button> <button onclick="removeCart(${ci})" style="background:#ef4444;color:#fff;border:0;padding:6px 10px;border-radius:8px">x</button></span></div>`}).join('');document.getElementById('total').innerText='Rp '+cart.reduce((a,b)=>{let p=products[b.idx];return a+b.qty*(p.discount||p.price)},0).toLocaleString('id-ID');}
function checkoutWA(){if(!cart.length)return alert('Keranjang kosong');let name=document.getElementById('buyerName').value.trim();let wa=document.getElementById('buyerWA').value.trim();let addr=document.getElementById('buyerAddr').value.trim();if(!name||!wa||!addr)return alert('Isi Nama, No WA, dan Alamat dulu!');let total=cart.reduce((a,b)=>{let p=products[b.idx];return a+b.qty*(p.discount||p.price)},0);let items=cart.map(c=>{let p=products[c.idx];return {name:p.name,qty:c.qty,price:(p.discount||p.price)}});orders.push({name:name,wa:wa,addr:addr,items:items,total:total,status:'Baru',date:new Date().toLocaleString('id-ID')});saveAll();let msg='Halo Izary Store, saya mau pesan:%0A'+items.map(it=>`- ${it.name} x ${it.qty} = Rp ${(it.price*it.qty).toLocaleString('id-ID')}`).join('%0A')+'%0A%0ATotal: Rp '+total.toLocaleString('id-ID')+'%0ANama: '+encodeURIComponent(name)+'%0AWA: '+encodeURIComponent(wa)+'%0AAlamat: '+encodeURIComponent(addr);window.open('https://wa.me/'+ADMIN_WA+'?text='+msg,'_blank');cart=[];saveAll();updateCart();alert('Pesanan terkirim ke WA Admin + tersimpan di Daftar Pesanan Admin!');}
function addProduct(){if(!document.getElementById('pName').value)return alert('Isi nama produk');products.push({name:document.getElementById('pName').value,price:+document.getElementById('pPrice').value||0,discount:+document.getElementById('pDisc').value||0,stock:+document.getElementById('pStock').value||0,desc:document.getElementById('pDesc').value,photo:tempPhoto,emoji:'📦'});tempPhoto='';saveAll();alert('Produk tersimpan!');renderAdmin();showPembeli();}
function del(i){if(confirm('Hapus?')){products.splice(i,1);saveAll();renderAdmin();render();}}
render();
</script></body></html>
